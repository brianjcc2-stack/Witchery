buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "anatawa12"
            url = "https://maven.anatawa12.com/"
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.0.+'
    }
}

apply plugin: 'forge'

version = "1.7.10-0.24.1"
group= "com.emoniph.witchery" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "witchery"

sourceCompatibility = 7
targetCompatibility = 7

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
	if (file('../run').exists()){
		assetDir = "../run/assets"
	}else{
		assetDir = "assets"
	}
}

repositories {
	mavenLocal()
	maven {
		name = "chickenbones"
		url = "http://chickenbones.net/maven/"
	}
    mavenCentral()
    maven {
        name 'Forge'
        url 'https://maven.minecraftforge.net/'
    }
}

dependencies
{
	compile fileTree(dir: "libs", include: "*.jar")
}


processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

ext.buildTimestamp = String.valueOf(System.currentTimeMillis())

jar {
    manifest {
        attributes(
            'FMLAT': 'witchery_at.cfg',
            'FMLCorePlugin': 'com.emoniph.witchery.updater.WitcheryCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'Witchery-Build-Timestamp': project.ext.buildTimestamp
        )
    }
    include 'META-INF/witchery_at.cfg'
    include '**/*'
}

import java.security.MessageDigest

afterEvaluate {
    def reobfTask = tasks.findByName('reobf')
    if (reobfTask != null) {
        reobfTask.doLast {
            File builtJar = jar.archivePath
            if (builtJar.exists()) {
                File releaseDir = file('release')
                releaseDir.mkdirs()
                File targetJar = new File(releaseDir, builtJar.name)
                targetJar.bytes = builtJar.bytes

                MessageDigest md = MessageDigest.getInstance("SHA-256")
                builtJar.eachByte(32768) { byte[] buf, int len ->
                    md.update(buf, 0, len)
                }
                String sha256 = md.digest().encodeHex().toString()
                File shaFile = new File(releaseDir, 'witchery.sha256')
                shaFile.setText("${sha256} ${project.ext.buildTimestamp}\n", "UTF-8")
                println "[Witchery AutoUpdater] Release preparado en release/${builtJar.name} (SHA-256: ${sha256}, Build: ${project.ext.buildTimestamp})"
            }
        }
    }
}
